<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignedIt — GoodPWR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f3f3f1;--panel:#fff;--soft:#f7f7f5;--ink:#25272a;--muted:#74777a;--line:#dedfdd;--dark:#303236;--accent:#666a70;--danger:#9a3f3f;--shadow:0 10px 30px rgba(0,0,0,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:30}.brand{font:600 22px Georgia,serif;letter-spacing:-.5px}.nav{display:flex;gap:4px;height:100%;align-items:center}.nav button{border:0;background:none;padding:10px 13px;color:var(--muted);border-radius:7px}.nav button.active,.nav button:hover{background:#f0f0ee;color:var(--ink)}.spacer{flex:1}.avatar{width:34px;height:34px;border-radius:50%;background:#34373a;color:#fff;display:grid;place-items:center;font-size:12px}.userbox{display:flex;align-items:center;gap:9px}.userbox small{display:block;color:var(--muted);font-size:11px}.shell{display:flex;min-height:calc(100vh - 64px)}.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.side h4{margin:0 10px 10px;color:#999;font-size:10px;text-transform:uppercase;letter-spacing:1.3px}.side button{display:flex;width:100%;border:0;background:none;padding:10px 11px;border-radius:7px;text-align:left;color:#5d6063;margin-bottom:2px}.side button:hover,.side button.active{background:#f0f0ee;color:#222}.side .count{margin-left:auto;color:#999}.main{flex:1;padding:30px 34px;min-width:0}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}.page-title h1{font:500 30px Georgia,serif;margin:0 0 5px}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:#333;border-radius:7px;padding:9px 13px}.btn:hover{background:#f3f3f1}.btn.dark{background:#303236;border-color:#303236;color:#fff}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 7px rgba(0,0,0,.02)}.template-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.template-name{font-weight:600}.meta{font-size:12px;color:var(--muted)}.card-actions{display:flex;gap:7px;align-items:center}.star{border:0;background:none;font-size:20px;color:#a7a9aa;padding:0}.star.on{color:#333}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed #cfd0ce;border-radius:10px;background:rgba(255,255,255,.5)}
/* editor */
.editor-top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px}.editor-name{min-width:220px;font-weight:600}.editor-layout{display:grid;grid-template-columns:190px minmax(450px,1fr) 270px;height:calc(100vh - 124px);overflow:hidden}.toolbox,.properties{background:#fff;overflow:auto}.toolbox{border-right:1px solid var(--line);padding:16px 12px}.properties{border-left:1px solid var(--line);padding:18px}.toolgroup{margin-bottom:18px}.toolgroup h5{margin:0 8px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999}.field-tool{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 10px;margin:3px 0;text-align:left;color:#444}.field-tool:hover{background:#f4f4f2}.canvas-wrap{overflow:auto;padding:30px;background:#e9e9e6}.doc-page{position:relative;margin:0 auto 25px;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.13);width:min(820px,90%)}.doc-page canvas{width:100%;height:auto;display:block}.overlay{position:absolute;inset:0}.field{position:absolute;border:1px solid #7b7e82;background:rgba(244,244,242,.88);border-radius:3px;display:flex;align-items:center;justify-content:center;min-width:18px;min-height:18px;user-select:none;touch-action:none}.field.selected{border:2px solid #36393c;background:rgba(232,232,228,.92);z-index:10}.field .tag{font-size:10px;color:#505256;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}.field .delete{position:absolute;right:-8px;top:-8px;width:17px;height:17px;border-radius:50%;border:0;background:#303236;color:#fff;font-size:12px;line-height:17px;padding:0;display:none}.field.selected .delete{display:block}.resize{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:#303236;border-radius:2px;display:none;cursor:nwse-resize}.field.selected .resize{display:block}.field input,.field select{width:100%;height:100%;border:0;background:transparent;outline:0;padding:3px;font-size:11px}.field input[type=checkbox]{width:18px;height:18px}.prop h3{font:500 20px Georgia,serif;margin:0 0 18px}.prop label{display:block;font-size:11px;color:#777;margin:12px 0 5px}.prop input,.prop select,.prop textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.prop-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rec-chip{padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin:4px 0;background:#fafaf8}.small{font-size:11px;color:var(--muted)}
/* auth/sign */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.38);display:flex;align-items:center;justify-content:center;z-index:100}.modal-card{background:#fff;width:min(470px,92vw);border-radius:12px;padding:25px;box-shadow:var(--shadow)}.modal-card h2{font:500 25px Georgia,serif;margin:0 0 7px}.modal-card input,.modal-card select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;margin:6px 0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;background:#303236;color:#fff;padding:11px 15px;border-radius:7px;z-index:200;box-shadow:var(--shadow)}
/* signing */
.sign-shell{max-width:1050px;margin:0 auto;padding:28px}.sign-head{background:#fff;border:1px solid var(--line);padding:16px 20px;border-radius:10px;display:flex;align-items:center;gap:15px;margin-bottom:18px}.sign-head h1{font:500 22px Georgia,serif;margin:0}.sign-doc{background:#e9e9e6;padding:25px}.sign-page{position:relative;margin:0 auto 20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.12);max-width:820px}.sign-page canvas{width:100%;display:block}.sign-page .field{border:1px solid #aaa;background:#fafaf8}.sign-page .field.assigned{border:2px solid #3f4347;background:#f0f0ed}.sign-footer{display:flex;justify-content:flex-end;margin-top:18px}.notice{padding:11px 13px;background:#f5f5f2;border:1px solid var(--line);border-radius:7px;color:#5f6265}.processing-overlay{position:fixed;inset:0;background:rgba(243,243,241,.86);display:flex;align-items:center;justify-content:center;z-index:500}.processing-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 34px;text-align:center;box-shadow:var(--shadow);min-width:280px}.spinner{width:30px;height:30px;border:3px solid #ddd;border-top-color:#303236;border-radius:50%;animation:siSpin .8s linear infinite;margin:0 auto 14px}@keyframes siSpin{to{transform:rotate(360deg)}}
@media(max-width:950px){.editor-layout{grid-template-columns:150px minmax(400px,1fr)}.properties{display:none}.side{width:190px}.nav{display:none}}@media(max-width:700px){.side{display:none}.main{padding:20px}.editor-layout{grid-template-columns:1fr}.toolbox{display:none}.editor-top{height:auto;min-height:60px;flex-wrap:wrap}.doc-page{width:96%}.sign-shell{padding:12px}.top{padding:0 13px}}
</style>
</head>
<body>
<div id="app"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// REPLACE THIS URL with your actual deployed Google Apps Script Web App URL ending in /exec
const API='https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID_HERE/exec';

const state={token:localStorage.getItem('si_token')||'',user:JSON.parse(localStorage.getItem('si_user')||'null'),view:'dashboard',section:'saved',templates:[],dashboard:null,pdf:null,fields:[],pages:[],selected:null,tool:null,editorTemplateId:null,recipients:[],signingMode:'sequential',signToken:new URLSearchParams(location.search).get('token'),completedMode:new URLSearchParams(location.search).get('completed')==='1',signingBusy:false};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toastRoot').append(e);setTimeout(()=>e.remove(),2600)}
async function api(action,data={}){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:state.token,data})});const j=await r.json();if(!j.success&&j.error==='UNAUTHORIZED'){logoutLocal();}return j}catch(e){return{success:false,message:'Could not reach the SignedIt backend.'}}}
function logoutLocal(){state.token='';state.user=null;localStorage.removeItem('si_token');localStorage.removeItem('si_user');render()}
function initials(n){return String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function authRequired(){if(!state.token){showLogin();return false}return true}
function showLogin(){modal(`<h2>GoodPWR Admin Login</h2><div class="sub">Access is restricted to authorized GoodPWR users.</div><label>Email</label><input id="mEmail" type="email"><label>Password</label><input id="mPass" type="password"><div id="mErr" class="small" style="color:var(--danger);margin-top:4px"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="doLogin()">Log in</button></div>`)}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
async function doLogin(){const email=$('#mEmail').value,password=$('#mPass').value,r=await api('login',{email,password});if(!r.success){$('#mErr').textContent=r.message;return}state.token=r.data.token;state.user=r.data;localStorage.setItem('si_token',state.token);localStorage.setItem('si_user',JSON.stringify(state.user));closeModal();render();toast('Welcome back.')}
async function doLogout(){await api('logout');logoutLocal()}
function render(){if(state.signToken){renderSigner();return}if(!state.token){renderLanding();return}if(state.view==='editor')renderEditor();else renderApp()}
function renderLanding(){$('#app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center"><div style="text-align:center;max-width:540px;padding:30px"><div class="brand" style="font-size:38px;margin-bottom:15px">SignedIt</div><h1 style="font:500 34px Georgia,serif">GoodPWR E-Signing</h1><p class="sub" style="line-height:1.7">Secure document templates and management restricted to authorized GoodPWR personnel.</p><button class="btn dark" onclick="showLogin()">Log in</button></div></div>`}
function renderApp(){const u=state.user||{};$('#app').innerHTML=`<header class="top"><div class="brand">SignedIt</div><nav class="nav"><button class="active">Workspace</button></nav><div class="spacer"></div><div class="userbox"><div class="avatar">${initials(u.name)}</div><div><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div></div><button class="btn" onclick="doLogout()">Log out</button></header><div class="shell"><aside class="side"><h4>Workspace</h4>${sideBtn('saved','Saved')}${sideBtn('created','Created by Me')}${sideBtn('shared','Shared with Me')}${sideBtn('recent','Recently Used')}${sideBtn('favorites','Favorites')}<h4 style="margin-top:25px">Signing</h4>${sideBtn('action','Action Required')}${sideBtn('pending','Pending')}${sideBtn('completed','Completed')}<h4 style="margin-top:25px">Manage</h4>${sideBtn('templates','Templates')}</aside><main class="main" id="main"></main></div>`;loadDashboard()}
function sideBtn(k,label){return `<button class="${state.section===k?'active':''}" onclick="state.section='${k}';loadDashboard()">${label}<span class="count"></span></button>`}
async function loadDashboard(){const m=$('#main');m.innerHTML='<div class="sub">Loading workspace…</div>';const r=await api('listDashboard');if(!r.success){m.innerHTML=`<div class="empty">${esc(r.message)}</div>`;return}state.dashboard=r.data;let list=[];let title='Saved';if(state.section==='created'){list=r.data.createdByMe;title='Created by Me'}else if(state.section==='shared'){list=r.data.sharedWithMe;title='Shared with Me'}else if(state.section==='recent'){list=r.data.recentlyUsed;title='Recently Used'}else if(state.section==='favorites'){list=r.data.favorites;title='Favorites'}else if(state.section==='templates'){list=r.data.saved;title='Templates'}else{list=r.data.saved;title='Saved'}m.innerHTML=`<div class="page-title"><div><h1>${title}</h1><div class="sub">GoodPWR SignedIt workspace</div></div><div><button class="btn dark" onclick="newTemplate()">+ Create template</button></div></div>${list.length?`<div class="cards">${list.map(t=>templateCard(t)).join('')}</div>`:`<div class="empty"><b>No ${title.toLowerCase()} yet.</b><div style="margin-top:7px">Create a template to get started.</div></div>`}`}
function templateCard(t){return `<div class="card template-card"><div><div style="display:flex;justify-content:space-between;gap:8px"><div class="template-name">${esc(t.name)}</div><button class="star ${t.isFavorite?'on':''}" onclick="event.stopPropagation();fav('${t.templateId}')">★</button></div><div class="meta" style="margin-top:6px">Updated ${new Date(t.updatedAt||t.createdAt).toLocaleString()}</div></div><div class="card-actions"><button class="btn" onclick="openTemplate('${t.templateId}')">Open</button><button class="btn" onclick="startSend('${t.templateId}')">Send</button></div></div>`}
async function fav(id){const r=await api('toggleFavorite',{itemId:id,itemType:'template'});if(r.success)loadDashboard()}
async function newTemplate(){const input=document.createElement('input');input.type='file';input.accept='application/pdf';input.onchange=async()=>{const f=input.files[0];if(!f)return;state.editorTemplateId=null;state.fields=[];await loadEditorPdf(await f.arrayBuffer());state.view='editor';render()};input.click()}
async function openTemplate(id){const r=await api('getTemplate',{templateId:id});if(!r.success)return toast(r.message);state.editorTemplateId=id;state.fields=r.data.fields;await loadEditorPdf(fromB64(r.data.pdfBase64));state.editorName=r.data.name;state.view='editor';render()}
function fromB64(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return b.buffer}function toB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(s)}
async function loadEditorPdf(buf){state.pdf=buf;const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;state.pages=[];state.renderedPages=[];const holder=document.createElement('div');holder.innerHTML='';for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),vp=p.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const page=document.createElement('div');page.className='doc-page';const ov=document.createElement('div');ov.className='overlay';ov.dataset.page=n-1;page.append(canvas,ov);state.pages.push({ov,ratio:vp.width/vp.height});holder.append(page)}state.renderedPages=Array.from(holder.children);}
function renderEditor(){if(!state.renderedPages){renderLanding();return}$('#app').innerHTML=`<div class="editor-top"><button class="btn" onclick="state.view='dashboard';render()">← Back</button><div class="editor-name">${esc(state.editorName||'Untitled template')}</div><div class="spacer"></div><button class="btn" onclick="saveTemplate()">Save</button><button class="btn dark" onclick="startSend(state.editorTemplateId)">Send</button></div><div class="editor-layout"><aside class="toolbox"><div class="toolgroup"><h5>Standard</h5>${tool('signature','Signature')}${tool('initials','Initials')}${tool('name','Name')}${tool('email','Email')}${tool('date','Date')}</div><div class="toolgroup"><h5>Input</h5>${tool('text','Text')}${tool('longtext','Longtext')}${tool('number','Number')}${tool('address','Address')}</div><div class="toolgroup"><h5>Selection</h5>${tool('checkbox','Checkbox')}${tool('dropdown','Dropdown')}${tool('radio','Radio')}</div><div class="toolgroup"><h5>Company</h5>${tool('company','Company')}${tool('job_title','Job title')}</div></aside><main class="canvas-wrap" id="canvasWrap"></main><aside class="properties" id="properties"><div class="small">Select a field to edit its properties.</div></aside></div>`;const cw=$('#canvasWrap');state.renderedPages.forEach(p=>cw.append(p));state.pages=state.renderedPages.map((p,i)=>({ov:p.querySelector('.overlay'),ratio:state.pages[i]?.ratio||1}));state.tool=null;renderFields()}
function tool(t,label){return `<button class="field-tool" onclick="selectTool('${t}')">${label}</button>`}
function selectTool(t){state.tool=state.tool===t?null:t;toast(state.tool?'Click the document to place '+t:'Field tool cancelled')}
function placeField(e,ov){if(!state.tool||e.target!==ov)return;const r=ov.getBoundingClientRect(),pg=state.pages[+ov.dataset.page];const sizes={signature:[.28,.07],initials:[.12,.05],text:[.25,.04],long_text:[.35,.09],number:[.16,.04],name:[.25,.04],email:[.28,.04],date:[.18,.04],checkbox:[.035,.035],dropdown:[.25,.04],radio:[.05,.05],address:[.35,.08],company:[.25,.04],job_title:[.25,.04]};const [w,h]=sizes[state.tool]||[.2,.04],x=Math.max(0,Math.min((e.clientX-r.left)/r.width,1-w)),y=Math.max(0,Math.min((e.clientY-r.top)/r.height,1-h));state.fields.push({id:crypto.randomUUID?.()||Math.random().toString(36).slice(2),type:state.tool,page:+ov.dataset.page,x,y,w,h,required:state.tool!=='checkbox',recipientRole:'1',value:state.tool==='checkbox'?false:'',properties:{options:['Option 1','Option 2'],radioGroup:'group1'}});state.tool=null;renderFields()}
function renderFields(){state.pages.forEach(p=>{p.ov.innerHTML='';p.ov.onclick=e=>placeField(e,p.ov)});state.fields.forEach(f=>{const el=document.createElement('div');el.className='field'+(state.selected===f.id?' selected':'');el.style.cssText=`left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%`;el.onclick=e=>{e.stopPropagation();state.selected=f.id;renderFields()};const del=document.createElement('button');del.className='delete';del.textContent='×';del.onclick=e=>{e.stopPropagation();state.fields=state.fields.filter(x=>x.id!==f.id);state.selected=null;renderFields()};
