<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignedIt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f3f3f1;--panel:#fff;--soft:#f7f7f5;--ink:#25272a;--muted:#74777a;--line:#dedfdd;--dark:#303236;--accent:#666a70;--danger:#9a3f3f;--shadow:0 10px 30px rgba(0,0,0,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:30}.brand{font:600 22px Georgia,serif;letter-spacing:-.5px}.nav{display:flex;gap:4px;height:100%;align-items:center}.nav button{border:0;background:none;padding:10px 13px;color:var(--muted);border-radius:7px}.nav button.active,.nav button:hover{background:#f0f0ee;color:var(--ink)}.spacer{flex:1}.avatar{width:34px;height:34px;border-radius:50%;background:#34373a;color:#fff;display:grid;place-items:center;font-size:12px}.userbox{display:flex;align-items:center;gap:9px}.userbox small{display:block;color:var(--muted);font-size:11px}.shell{display:flex;min-height:calc(100vh - 64px)}.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.side h4{margin:0 10px 10px;color:#999;font-size:10px;text-transform:uppercase;letter-spacing:1.3px}.side button{display:flex;width:100%;border:0;background:none;padding:10px 11px;border-radius:7px;text-align:left;color:#5d6063;margin-bottom:2px}.side button:hover,.side button.active{background:#f0f0ee;color:#222}.side .count{margin-left:auto;color:#999}.main{flex:1;padding:30px 34px;min-width:0}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}.page-title h1{font:500 30px Georgia,serif;margin:0 0 5px}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:#333;border-radius:7px;padding:9px 13px}.btn:hover{background:#f3f3f1}.btn.dark{background:#303236;border-color:#303236;color:#fff}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 7px rgba(0,0,0,.02)}.template-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.template-name{font-weight:600}.meta{font-size:12px;color:var(--muted)}.card-actions{display:flex;gap:7px;align-items:center}.star{border:0;background:none;font-size:20px;color:#a7a9aa;padding:0}.star.on{color:#333}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed #cfd0ce;border-radius:10px;background:rgba(255,255,255,.5)}
/* editor */
.editor-top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px}.editor-name{min-width:220px;font-weight:600}.editor-layout{display:grid;grid-template-columns:190px minmax(450px,1fr) 270px;height:calc(100vh - 124px);overflow:hidden}.toolbox,.properties{background:#fff;overflow:auto}.toolbox{border-right:1px solid var(--line);padding:16px 12px}.properties{border-left:1px solid var(--line);padding:18px}.toolgroup{margin-bottom:18px}.toolgroup h5{margin:0 8px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999}.field-tool{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 10px;margin:3px 0;text-align:left;color:#444}.field-tool:hover{background:#f4f4f2}.canvas-wrap{overflow:auto;padding:30px;background:#e9e9e6}.doc-page{position:relative;margin:0 auto 25px;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.13);width:min(820px,90%)}.doc-page canvas{width:100%;height:auto;display:block}.overlay{position:absolute;inset:0}.field{position:absolute;border:1px solid #7b7e82;background:rgba(244,244,242,.88);border-radius:3px;display:flex;align-items:center;justify-content:center;min-width:18px;min-height:18px;user-select:none;touch-action:none}.field.selected{border:2px solid #36393c;background:rgba(232,232,228,.92);z-index:10}.field .tag{font-size:10px;color:#505256;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}.field .delete{position:absolute;right:-8px;top:-8px;width:17px;height:17px;border-radius:50%;border:0;background:#303236;color:#fff;font-size:12px;line-height:17px;padding:0;display:none}.field.selected .delete{display:block}.resize{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:#303236;border-radius:2px;display:none;cursor:nwse-resize}.field.selected .resize{display:block}.field input,.field select{width:100%;height:100%;border:0;background:transparent;outline:0;padding:3px;font-size:11px}.field input[type=checkbox]{width:18px;height:18px}.prop h3{font:500 20px Georgia,serif;margin:0 0 18px}.prop label{display:block;font-size:11px;color:#777;margin:12px 0 5px}.prop input,.prop select,.prop textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.prop-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rec-chip{padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin:4px 0;background:#fafaf8}.small{font-size:11px;color:var(--muted)}
/* auth/sign */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.38);display:flex;align-items:center;justify-content:center;z-index:100}.modal-card{background:#fff;width:min(470px,92vw);border-radius:12px;padding:25px;box-shadow:var(--shadow)}.modal-card h2{font:500 25px Georgia,serif;margin:0 0 7px}.modal-card input,.modal-card select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;margin:6px 0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;background:#303236;color:#fff;padding:11px 15px;border-radius:7px;z-index:200;box-shadow:var(--shadow)}
/* signing */
.sign-shell{max-width:1050px;margin:0 auto;padding:28px}.sign-head{background:#fff;border:1px solid var(--line);padding:16px 20px;border-radius:10px;display:flex;align-items:center;gap:15px;margin-bottom:18px}.sign-head h1{font:500 22px Georgia,serif;margin:0}.sign-doc{background:#e9e9e6;padding:25px}.sign-page{position:relative;margin:0 auto 20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.12);max-width:820px}.sign-page canvas{width:100%;display:block}.sign-page .field{border:1px solid #aaa;background:#fafaf8}.sign-page .field.assigned{border:2px solid #3f4347;background:#f0f0ed}.sign-footer{display:flex;justify-content:flex-end;margin-top:18px}.notice{padding:11px 13px;background:#f5f5f2;border:1px solid var(--line);border-radius:7px;color:#5f6265}.processing-overlay{position:fixed;inset:0;background:rgba(243,243,241,.86);display:flex;align-items:center;justify-content:center;z-index:500}.processing-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 34px;text-align:center;box-shadow:var(--shadow);min-width:280px}.spinner{width:30px;height:30px;border:3px solid #ddd;border-top-color:#303236;border-radius:50%;animation:siSpin .8s linear infinite;margin:0 auto 14px}@keyframes siSpin{to{transform:rotate(360deg)}}
@media(max-width:950px){.editor-layout{grid-template-columns:150px minmax(400px,1fr)}.properties{display:none}.side{width:190px}.nav{display:none}}@media(max-width:700px){.side{display:none}.main{padding:20px}.editor-layout{grid-template-columns:1fr}.toolbox{display:none}.editor-top{height:auto;min-height:60px;flex-wrap:wrap}.doc-page{width:96%}.sign-shell{padding:12px}.top{padding:0 13px}}
</style>
</head>
<body>
<div id="app"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const API='https://script.google.com/macros/s/AKfycbzqVpPZbTiYhN6NWOzq_VUlqDkztQmTgl9yQrA1fkIN7xgBPVj1lDjCq67Uv537PhsNFQ/exec';
const params=new URLSearchParams(location.search);
const state={
  view:'dashboard',section:'saved',pdf:null,fields:[],pages:[],selected:null,tool:null,
  editorTemplateId:null,editorName:'',renderedPages:null,recipients:[],signingMode:'sequential',
  signToken:params.get('token'),completedMode:params.get('completed')==='1',signingBusy:false,signSession:null
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toastRoot').append(e);setTimeout(()=>e.remove(),3000)}
async function api(action,data={}){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});
    return await r.json();
  }catch(e){return{success:false,message:'Could not reach the SignedIt backend.'};}
}
function initials(n){return String(n||'G').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function render(){if(state.signToken&&state.completedMode){renderCompletedDocument();return}if(state.signToken){renderSigner();return}if(state.view==='editor')renderEditor();else renderApp()}
function renderApp(){$('#app').innerHTML=`
<header class="top"><div class="brand">SignedIt</div><nav class="nav"><button class="active">Workspace</button></nav><div class="spacer"></div><div class="userbox"><div class="avatar">GP</div><div><b>GoodPWR Team</b><small>Open workspace</small></div></div></header>
<div class="shell"><aside class="side"><h4>Workspace</h4>${sideBtn('saved','Saved')}${sideBtn('created','Created by Me')}${sideBtn('shared','Shared with Me')}${sideBtn('recent','Recently Used')}${sideBtn('favorites','Favorites')}<h4 style="margin-top:25px">Signing</h4>${sideBtn('action','Action Required')}${sideBtn('pending','Pending')}${sideBtn('completed','Completed')}<h4 style="margin-top:25px">Manage</h4>${sideBtn('templates','Templates')}</aside><main class="main" id="main"></main></div>`;loadDashboard()}
function sideBtn(k,label){return `<button class="${state.section===k?'active':''}" onclick="state.section='${k}';loadDashboard()">${label}<span class="count"></span></button>`}
async function loadDashboard(){
  const m=$('#main');m.innerHTML='<div class="sub">Loading workspace…</div>';
  const r=await api('listDashboard');
  if(!r.success){m.innerHTML=`<div class="empty">${esc(r.message)}</div>`;return}
  const d=r.data||{};let list=d.saved||[],title='Saved';
  if(state.section==='created'){list=d.createdByMe||[];title='Created by Me'}
  else if(state.section==='shared'){list=d.sharedWithMe||[];title='Shared with Me'}
  else if(state.section==='recent'){list=d.recentlyUsed||[];title='Recently Used'}
  else if(state.section==='favorites'){list=d.favorites||[];title='Favorites'}
  else if(state.section==='templates'){list=d.saved||[];title='Templates'}
  else if(state.section==='action'||state.section==='pending'||state.section==='completed'){list=[];title=state.section==='action'?'Action Required':state.section==='pending'?'Pending':'Completed'}
  m.innerHTML=`<div class="page-title"><div><h1>${esc(title)}</h1><div class="sub">Your shared SignedIt workspace.</div></div><div><button class="btn dark" onclick="newTemplate()">+ Create template</button></div></div>${list.length?`<div class="cards">${list.map(t=>templateCard(t)).join('')}</div>`:`<div class="empty"><b>No ${esc(title.toLowerCase())} yet.</b><div style="margin-top:7px">Create a template to get started.</div></div>`}`;
}
function templateCard(t){return `<div class="card template-card"><div><div style="display:flex;justify-content:space-between;gap:8px"><div class="template-name">${esc(t.name)}</div><button class="star ${t.isFavorite?'on':''}" onclick="event.stopPropagation();fav('${esc(t.templateId)}')">★</button></div><div class="meta" style="margin-top:6px">Updated ${new Date(t.updatedAt||t.createdAt).toLocaleString()}</div></div><div class="card-actions"><button class="btn" onclick="openTemplate('${esc(t.templateId)}')">Open</button><button class="btn" onclick="startSend('${esc(t.templateId)}')">Send</button></div></div>`}
async function fav(id){const r=await api('toggleFavorite',{itemId:id,itemType:'template'});if(r.success)loadDashboard();else toast(r.message)}
async function newTemplate(){const input=document.createElement('input');input.type='file';input.accept='application/pdf';input.onchange=async()=>{const f=input.files[0];if(!f)return;state.editorTemplateId=null;state.editorName=f.name.replace(/\.pdf$/i,'');state.fields=[];state.selected=null;await loadEditorPdf(await f.arrayBuffer());state.view='editor';render()};input.click()}
async function openTemplate(id){const r=await api('getTemplate',{templateId:id});if(!r.success)return toast(r.message);state.editorTemplateId=id;state.fields=r.data.fields||[];state.editorName=r.data.name||'Untitled template';state.selected=null;await loadEditorPdf(fromB64(r.data.pdfBase64));state.view='editor';render()}
function fromB64(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return b.buffer}
function toB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(s)}
async function loadEditorPdf(buf){
  state.pdf=buf;const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;state.pages=[];state.renderedPages=[];const holder=document.createElement('div');
  for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),vp=p.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const page=document.createElement('div');page.className='doc-page';const ov=document.createElement('div');ov.className='overlay';ov.dataset.page=n-1;page.append(canvas,ov);state.pages.push({ov,ratio:vp.width/vp.height});holder.append(page)}
  state.renderedPages=Array.from(holder.children);
}
function renderEditor(){
  if(!state.renderedPages){renderApp();return}
  $('#app').innerHTML=`<div class="editor-top"><button class="btn" onclick="state.view='dashboard';render()">← Back</button><div class="editor-name">${esc(state.editorName||'Untitled template')}</div><div class="spacer"></div><button class="btn" onclick="saveTemplate()">Save</button><button class="btn dark" onclick="startSend(state.editorTemplateId)">Send</button></div><div class="editor-layout"><aside class="toolbox"><div class="toolgroup"><h5>Standard</h5>${tool('signature','Signature')}${tool('initials','Initials')}${tool('name','Name')}${tool('email','Email')}${tool('date','Date')}</div><div class="toolgroup"><h5>Input</h5>${tool('text','Text')}${tool('long_text','Long text')}${tool('number','Number')}${tool('address','Address')}</div><div class="toolgroup"><h5>Selection</h5>${tool('checkbox','Checkbox')}${tool('dropdown','Dropdown')}${tool('radio','Radio')}</div><div class="toolgroup"><h5>Company</h5>${tool('company','Company')}${tool('job_title','Job title')}</div></aside><main class="canvas-wrap" id="canvasWrap"></main><aside class="properties" id="properties"><div class="small">Select a field to edit its properties.</div></aside></div>`;
  const cw=$('#canvasWrap');state.renderedPages.forEach(p=>cw.append(p));state.pages=state.renderedPages.map((p,i)=>({ov:p.querySelector('.overlay'),ratio:state.pages[i]?.ratio||1}));renderFields();
}
function tool(t,label){return `<button class="field-tool" onclick="selectTool('${t}')">${label}</button>`}
function selectTool(t){state.tool=state.tool===t?null:t;toast(state.tool?'Click the document to place '+t:'Field tool cancelled')}
function placeField(e,ov){
  if(!state.tool||e.target!==ov)return;const r=ov.getBoundingClientRect();const sizes={signature:[.28,.07],initials:[.12,.05],text:[.25,.04],long_text:[.35,.09],number:[.16,.04],name:[.25,.04],email:[.28,.04],date:[.18,.04],checkbox:[.035,.035],dropdown:[.25,.04],radio:[.05,.05],address:[.35,.08],company:[.25,.04],job_title:[.25,.04]};
  const [w,h]=sizes[state.tool]||[.2,.04],x=Math.max(0,Math.min((e.clientX-r.left)/r.width,1-w)),y=Math.max(0,Math.min((e.clientY-r.top)/r.height,1-h));
  state.fields.push({id:crypto.randomUUID?.()||Math.random().toString(36).slice(2),type:state.tool,page:+ov.dataset.page,x,y,w,h,required:state.tool!=='checkbox',recipientRole:'1',value:state.tool==='checkbox'?false:'',properties:{options:['Option 1','Option 2'],radioGroup:'group1'}});state.tool=null;renderFields();
}
function renderFields(){
  state.pages.forEach(p=>{p.ov.innerHTML='';p.ov.onclick=e=>placeField(e,p.ov)});
  state.fields.forEach(f=>{const el=document.createElement('div');el.className='field'+(state.selected===f.id?' selected':'');el.style.left=f.x*100+'%';el.style.top=f.y*100+'%';el.style.width=f.w*100+'%';el.style.height=f.h*100+'%';el.onclick=e=>{e.stopPropagation();state.selected=f.id;renderFields()};const del=document.createElement('button');del.className='delete';del.textContent='×';del.onclick=e=>{e.stopPropagation();state.fields=state.fields.filter(x=>x.id!==f.id);state.selected=null;renderFields()};el.append(del);const tag=document.createElement('div');tag.className='tag';tag.textContent=f.type==='checkbox'?'☐':f.type.replace('_',' ');el.append(tag);const rz=document.createElement('div');rz.className='resize';rz.onpointerdown=e=>dragField(e,f,el,'resize');el.append(rz);el.onpointerdown=e=>{if(e.target===del||e.target===rz)return;dragField(e,f,el,'move')};state.pages[f.page]?.ov.append(el)});renderProperties();
}
function dragField(e,f,el,kind){e.preventDefault();e.stopPropagation();state.selected=f.id;const r=el.parentElement.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=f.x,oy=f.y,ow=f.w,oh=f.h;const move=ev=>{const dx=(ev.clientX-sx)/r.width,dy=(ev.clientY-sy)/r.height;if(kind==='move'){f.x=Math.min(Math.max(ox+dx,0),1-f.w);f.y=Math.min(Math.max(oy+dy,0),1-f.h)}else{f.w=Math.min(Math.max(ow+dx,.02),1-f.x);f.h=Math.min(Math.max(oh+dy,.02),1-f.y)}el.style.left=f.x*100+'%';el.style.top=f.y*100+'%';el.style.width=f.w*100+'%';el.style.height=f.h*100+'%'};const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);renderProperties()};addEventListener('pointermove',move);addEventListener('pointerup',up)}
function renderProperties(){
  const p=$('#properties');if(!p)return;const f=state.fields.find(x=>x.id===state.selected);if(!f){p.innerHTML='<div class="small">Select a field to edit its properties.</div>';return}
  p.innerHTML=`<div class="prop"><h3>${esc(f.type.replace('_',' '))}</h3><label>Assigned signer</label><select id="pRecipient"><option value="1" ${f.recipientRole==='1'?'selected':''}>Signer 1</option><option value="2" ${f.recipientRole==='2'?'selected':''}>Signer 2</option><option value="3" ${f.recipientRole==='3'?'selected':''}>Signer 3</option></select><label>Required</label><select id="pReq"><option value="1" ${f.required?'selected':''}>Required</option><option value="0" ${!f.required?'selected':''}>Optional</option></select>${f.type==='dropdown'?'<label>Dropdown options (one per line)</label><textarea id="pOpts" rows="6">'+esc((f.properties?.options||[]).join('\n'))+'</textarea>':''}${f.type==='number'?'<label>Number rules</label><div class="small">Numbers only are enforced during signing.</div>':''}<div class="small" style="margin-top:16px">Position and size are saved automatically when the template is saved.</div></div>`;
  $('#pRecipient').onchange=e=>{f.recipientRole=e.target.value};$('#pReq').onchange=e=>{f.required=e.target.value==='1'};if($('#pOpts'))$('#pOpts').oninput=e=>{f.properties.options=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean)};
}
async function saveTemplate(){if(!state.pdf)return;const name=state.editorName||prompt('Template name:','Untitled template');if(!name)return;state.editorName=name;const r=await api('saveTemplate',{templateId:state.editorTemplateId,name,pdfBase64:toB64(state.pdf),fields:state.fields.map(f=>({page:f.page,type:f.type,x:f.x,y:f.y,w:f.w,h:f.h,required:f.required,recipientRole:f.recipientRole,properties:f.properties}))});if(!r.success)return toast(r.message);state.editorTemplateId=r.data.templateId;toast('Template saved.')}
function startSend(templateId){if(!templateId){toast('Save the template before sending.');return}state.recipients=[{name:'',email:''}];state.signingMode='sequential';modal(`<h2>Send document</h2><div class="sub">Add signers in signing order. SignedIt uses sequential signing so every signature is preserved in the final PDF.</div><label>Signing mode</label><select id="sendMode" disabled><option value="sequential" selected>Sequential — one signer at a time</option></select><div id="recList"></div><button class="btn" onclick="addRecRow()">+ Add signer</button><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="createAndSend('${templateId}')">Create & send</button></div>`);renderRecRows()}
function renderRecRows(){const box=$('#recList');if(!box)return;box.innerHTML=state.recipients.map((r,i)=>`<div class="card" style="margin:10px 0;padding:12px"><b>Signer ${i+1}</b><input id="rn${i}" placeholder="Full name" value="${esc(r.name)}"><input id="re${i}" placeholder="Email" value="${esc(r.email)}"></div>`).join('')}
function addRecRow(){state.recipients.push({name:'',email:''});renderRecRows()}
async function createAndSend(templateId){state.recipients=state.recipients.map((r,i)=>({name:$(`#rn${i}`).value,email:$(`#re${i}`).value}));if(state.recipients.some(r=>!r.name||!r.email)){toast('Complete every signer.');return}const r=await api('createEnvelope',{templateId,signingMode:'sequential',recipients:state.recipients});if(!r.success)return toast(r.message);const send=await api('sendEnvelope',{envelopeId:r.data.envelopeId,signingUrl:location.origin+location.pathname});if(!send.success)return toast(send.message);closeModal();toast('Document sent.')}

async function renderSigner(){
  const r=await api('signingSession',{token:state.signToken});
  if(!r.success){const alreadySigned=r.error==='ALREADY_SIGNED';$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><h2 style="font:500 25px Georgia,serif">${alreadySigned?'Signing already completed.':'Signing link unavailable.'}</h2><div style="margin-top:7px">${esc(r.message)}</div>${alreadySigned?'<div style="margin-top:10px">You cannot edit or submit this signing step again.</div>':''}</div></div>`;return}
  state.signSession=r.data;
  $('#app').innerHTML=`<div class="sign-shell"><div class="sign-head"><div><div class="brand">SignedIt</div><div class="small">Secure signing</div></div><div class="spacer"></div><div class="notice">Signing as <b>${esc(r.data.recipient.name)}</b></div></div><div class="sign-doc" id="signDoc"></div><div class="sign-footer"><button class="btn dark" onclick="submitSigner()">Finish signing</button></div></div>`;
  await renderSignPdf(r.data);
}
async function renderSignPdf(data){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(fromB64(data.pdfBase64))}).promise;const host=$('#signDoc');host.innerHTML='';
  for(let n=1;n<=pdf.numPages;n++){
    const p=await pdf.getPage(n),vp=p.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    const pg=document.createElement('div');pg.className='sign-page';const ov=document.createElement('div');ov.className='overlay';pg.append(canvas,ov);host.append(pg);
    data.fields.filter(f=>Number(f.page)===n-1).forEach(f=>{
      const el=document.createElement('div');el.dataset.fieldId=f.id;el.className='field'+((!f.recipientRole||String(f.recipientRole)===String(data.recipient.sequence))?' assigned':'');el.style.left=f.x*100+'%';el.style.top=f.y*100+'%';el.style.width=f.w*100+'%';el.style.height=f.h*100+'%';
      const owned=!f.recipientRole||String(f.recipientRole)===String(data.recipient.sequence);const completed=!!f.value||f.value===true;
      if(!owned){el.style.pointerEvents='none';el.style.background='transparent';el.style.border='0';if(completed)el.setAttribute('aria-label','Completed field');ov.append(el);return}
      if(f.type==='signature'||f.type==='initials'){el.textContent=f.value?'Signed':'Click to sign';el.onclick=()=>signatureFor(f,el)}
      else if(f.type==='checkbox'){const c=document.createElement('input');c.type='checkbox';c.checked=f.value===true||f.value==='true';c.onchange=()=>f.value=c.checked;el.append(c)}
      else if(f.type==='dropdown'){const s=document.createElement('select');(f.properties?.options||[]).forEach(o=>{const op=document.createElement('option');op.textContent=o;op.value=o;s.append(op)});s.value=f.value||'';s.onchange=()=>f.value=s.value;el.append(s)}
      else if(f.type==='number'){const i=document.createElement('input');i.type='number';i.value=f.value||'';i.oninput=()=>f.value=i.value;el.append(i)}
      else if(f.type==='date'){const i=document.createElement('input');i.type='date';i.value=f.value||'';i.oninput=()=>f.value=i.value;el.append(i)}
      else{const i=document.createElement('input');i.type='text';i.value=f.value||'';i.placeholder=f.type.replace('_',' ');i.oninput=()=>f.value=i.value;el.append(i)}
      ov.append(el);
    });
  }
}
let sigTarget=null,sigTargetElement=null;
function signatureFor(f,el){sigTarget=f;sigTargetElement=el;modal(`<h2>Your signature</h2><canvas id="sigPad" width="600" height="180" style="width:100%;border:1px dashed #aaa;border-radius:7px;touch-action:none"></canvas><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="applySignerSig()">Apply</button></div>`);const c=$('#sigPad'),ctx=c.getContext('2d');let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height)};c.onpointermove=e=>{if(!down)return;const r=c.getBoundingClientRect();ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()};c.onpointerup=()=>down=false}
function applySignerSig(){const c=$('#sigPad');if(!c||!sigTarget)return;sigTarget.value=c.toDataURL('image/png');closeModal();if(sigTargetElement){sigTargetElement.textContent='Signed';sigTargetElement.classList.add('assigned')}sigTarget=null;sigTargetElement=null}
async function submitSigner(){
  if(state.signingBusy)return;const data={};
  for(const f of state.signSession.fields){const owned=!f.recipientRole||String(f.recipientRole)===String(state.signSession.recipient.sequence);if(!owned)continue;if(f.required&&(!f.value||String(f.value)==='')){toast('Please complete all required fields.');return}if(f.type==='number'&&f.value!==''&&!/^[-+]?\d*(\.\d+)?$/.test(String(f.value))){toast('Number fields accept numbers only.');return}data[f.id]=f.value}
  state.signingBusy=true;const button=document.querySelector('.sign-footer .btn.dark');if(button){button.disabled=true;button.innerHTML='<span style="display:inline-flex;align-items:center;gap:8px"><span class="spinner" style="width:15px;height:15px;border-width:2px;margin:0"></span> Processing…</span>'}
  showProcessing('Processing your signature…','Please wait while SignedIt saves your signing step. Do not close or refresh this page.');
  try{const finalPdfBase64=await buildCompletedPdf();const r=await api('submitSigning',{token:state.signToken,values:data,pdfBase64:finalPdfBase64,signingUrl:location.origin+location.pathname});hideProcessing();if(!r.success){state.signingBusy=false;if(button){button.disabled=false;button.textContent='Finish signing'}toast(r.message);return}
    if(r.data.envelopeCompleted){$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><h2 style="font:500 28px Georgia,serif">Document completed.</h2><div>All required signers have completed the document.</div><div style="margin-top:10px">A copy of the completed signed document has been sent to all signers.</div><div style="margin-top:18px"><button class="btn dark" onclick="downloadCompleted()">Download signed document</button></div></div></div>`}
    else{$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><h2 style="font:500 28px Georgia,serif">Thank you.</h2><div>Your signing step has been completed successfully.</div><div style="margin-top:10px">You can no longer edit this signing step.</div><div style="margin-top:10px">The document has been sent to the next signer.</div></div></div>`}
  }catch(e){hideProcessing();state.signingBusy=false;if(button){button.disabled=false;button.textContent='Finish signing'}toast('Could not prepare the document: '+(e&&e.message?e.message:'Unknown error'));console.error(e)}
}
function showProcessing(title,message){let root=document.getElementById('processingRoot');if(!root){root=document.createElement('div');root.id='processingRoot';document.body.append(root)}root.innerHTML=`<div class="processing-overlay"><div class="processing-card"><div class="spinner"></div><div style="font:500 20px Georgia,serif;margin-bottom:7px">${esc(title)}</div><div class="sub" style="line-height:1.5">${esc(message)}</div></div></div>`}
function hideProcessing(){const root=document.getElementById('processingRoot');if(root)root.remove()}
function pdfFieldRect(page,f){const pageW=page.getWidth(),pageH=page.getHeight(),nx=Math.max(0,Math.min(1,Number(f.x)||0)),ny=Math.max(0,Math.min(1,Number(f.y)||0)),nw=Math.max(0,Math.min(1-nx,Number(f.w)||0)),nh=Math.max(0,Math.min(1-ny,Number(f.h)||0));return{x:nx*pageW,y:pageH-((ny+nh)*pageH),width:nw*pageW,height:nh*pageH}}
function cleanPdfText(value){return String(value??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[✓✔☑☒]/g,'X')}
async function buildCompletedPdf(){
  if(!state.signSession||!state.signSession.pdfBase64)throw new Error('The signing PDF is unavailable.');const {PDFDocument,StandardFonts,rgb}=PDFLib;const pdfDoc=await PDFDocument.load(fromB64(state.signSession.pdfBase64));const font=await pdfDoc.embedFont(StandardFonts.Helvetica);const currentSequence=String(state.signSession.recipient.sequence);
  for(const f of state.signSession.fields){const owned=!f.recipientRole||String(f.recipientRole)===currentSequence;if(!owned||f.value===undefined||f.value===null||String(f.value)==='')continue;const pageIndex=Number(f.page),pages=pdfDoc.getPages();if(!Number.isInteger(pageIndex)||pageIndex<0||pageIndex>=pages.length)throw new Error('Field "'+String(f.type)+'" points to an invalid PDF page.');const page=pages[pageIndex],rect=pdfFieldRect(page,f),x=rect.x,y=rect.y,w=rect.width,h=rect.height;if(w<=0||h<=0)continue;
    if(f.type==='signature'||f.type==='initials'){if(String(f.value).startsWith('data:image/')){const raw=String(f.value).split(',')[1],bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0)),image=await pdfDoc.embedPng(bytes),dims=image.scale(1),scale=Math.min(w/dims.width,h/dims.height),iw=dims.width*scale,ih=dims.height*scale;page.drawImage(image,{x:x+(w-iw)/2,y:y+(h-ih)/2,width:iw,height:ih})}continue}
    if(f.type==='checkbox'){if(f.value===true||String(f.value)==='true'){const size=Math.max(7,Math.min(18,h*.65));page.drawText('X',{x:x+(w-size)/2,y:y+(h-size)/2+1,size,font,color:rgb(.15,.15,.15)})}continue}
    const text=cleanPdfText(f.value);if(!text)continue;const padding=Math.max(2,Math.min(5,h*.12)),availableW=Math.max(1,w-padding*2),availableH=Math.max(1,h-padding*2);let size=Math.max(6,Math.min(16,h*.58));while(size>6&&font.widthOfTextAtSize(text.split(/\r?\n/)[0],size)>availableW)size-=.5;const lineHeight=size*1.15,maxLines=Math.max(1,Math.floor(availableH/lineHeight)),rawLines=text.split(/\r?\n/),lines=[];for(const rawLine of rawLines){let line=rawLine;if(font.widthOfTextAtSize(line,size)<=availableW){lines.push(line);continue}let chunk='';for(const word of line.split(/\s+/)){const test=chunk?chunk+' '+word:word;if(font.widthOfTextAtSize(test,size)<=availableW)chunk=test;else{if(chunk)lines.push(chunk);chunk=word}}if(chunk)lines.push(chunk)}const visible=lines.slice(0,maxLines),firstY=y+h-padding-size;visible.forEach((line,i)=>page.drawText(line,{x:x+padding,y:firstY-i*lineHeight,size,font,color:rgb(.15,.15,.15)}));
  }
  return toB64(await pdfDoc.save())
}
async function renderCompletedDocument(){$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><div class="spinner"></div><h2 style="font:500 24px Georgia,serif">Loading completed document…</h2><div>Please wait.</div></div></div>`;const r=await api('completedDocument',{token:state.signToken});if(!r.success){$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><h2 style="font:500 24px Georgia,serif">Document not ready yet.</h2><div>${esc(r.message)}</div></div></div>`;return}$('#app').innerHTML=`<div class="sign-shell"><div class="empty"><div class="brand" style="margin-bottom:12px">SignedIt</div><h2 style="font:500 28px Georgia,serif">Your signed document is ready.</h2><div>${esc(r.data?.documentName||r.documentName||'Completed document')}</div><div style="margin-top:18px"><button class="btn dark" onclick="downloadCompleted()">Download signed document</button></div></div></div>`}
async function downloadCompleted(){showProcessing('Preparing download…','Please wait while SignedIt retrieves your completed signed document.');const r=await api('completedDocument',{token:state.signToken});hideProcessing();if(!r.success){toast(r.message);return}const data=r.data||r;const bytes=Uint8Array.from(atob(data.pdfBase64),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=data.documentName||'SignedIt - Completed.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script>
